<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0b111c; --panel:#131b29; --line:rgba(255,255,255,.07);
  --tx:#f2f6fb; --mut:#8fa0b6; --blue:#5cb8ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation;background:var(--bg);overflow:hidden;color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:768px;padding:16px;
  display:flex;flex-direction:row;gap:12px;transform-origin:center center}
.main{width:992px;flex:none;display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top: now ---------- */
.top{height:262px;flex:none;display:flex;gap:12px}
.hero{width:430px;border-radius:26px;padding:16px 22px 12px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;transition:background .6s;
  background:#1a2436}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 8%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.place{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600;letter-spacing:.01em;text-align:left}
.place svg{flex:none;opacity:.9}
.when{font-size:15px;opacity:.82;margin-top:2px}
.hero .mid{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.temp{font-size:96px;font-weight:300;line-height:.9;letter-spacing:-.04em;text-align:left}
.temp sup{font-size:48px;font-weight:400;vertical-align:top;position:relative;top:8px;margin-left:2px;letter-spacing:0}
.hero .ico{width:94px;height:94px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.cond{font-size:26px;font-weight:600;margin-top:12px}
.sub{display:flex;gap:14px;font-size:16px;opacity:.9;margin-top:4px}

.tiles{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 16px;
  display:flex;flex-direction:column;position:relative;text-align:left;overflow:hidden;min-width:0}
.lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.val{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-top:auto}
.val small{font-size:17px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:4px}
.tsub{font-size:14px;color:var(--mut);margin-top:5px;white-space:nowrap}
.dial{position:absolute;right:12px;top:12px}
.sun2{display:flex;flex-direction:column;gap:2px;margin-top:auto}
.sun2 div{font-size:24px;font-weight:600;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.sun2 span{width:38px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.1em}
.uvbar{height:6px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,#4fd1c5,#f6d04d,#f6a23d,#f26b4f,#b455e0);position:relative}
.uvbar i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px var(--panel)}

/* ---------- bottom: hourly ---------- */
.hourly{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:12px 16px 8px;position:relative;
  display:flex;flex-direction:column}
.grid{position:relative;flex:1;display:flex;flex-direction:column}
.cols,.row{display:grid;grid-template-columns:78px repeat(var(--n,12),1fr)}
.cols{position:absolute;inset:0}
.cols i{display:block;border-radius:12px}
.cols i.n{background:rgba(255,255,255,.045)}
.cols i.now{background:rgba(92,184,255,.13);box-shadow:inset 0 0 0 1.5px rgba(92,184,255,.55)}
.rows{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:0}
.row>b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);align-self:center;line-height:1.25}
.row>div{display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;min-width:0}
.hd{height:40px}
.hd em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--blue);text-transform:uppercase;height:11px;line-height:1}
.hd span{font-size:19px;font-weight:600;line-height:1.1}
.hd .nowt span{color:var(--blue)}
.step{align-self:center;justify-self:start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;color:var(--tx);white-space:nowrap}
.ic{height:42px}.ic svg{width:34px;height:34px}
.tp{height:72px}
.tp>div.chart{grid-column:2/-1;display:block;position:relative}
.tp svg.line{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid #ffb347;transform:translate(-50%,-50%)}
.tl{position:absolute;transform:translate(-50%,-100%);font-size:19px;font-weight:600}
.ar{height:26px}
.wb{height:56px}
.wv{height:34px}
.wv span{font-size:18px;font-weight:600;line-height:1.05}
.wv small{font-size:11px;color:var(--mut);height:12px}
.wb>div{justify-content:flex-end!important}
.bar{width:60%;border-radius:7px 7px 3px 3px;position:relative;min-height:4px}
.gust{position:absolute;left:-12%;width:124%;height:3px;border-radius:2px;background:#fff}
.wn{height:34px}
.wn span{font-size:20px;font-weight:600;line-height:1}
.wn small{font-size:13px;color:var(--mut);margin-left:1px}
.rn{height:44px}
.rn span{font-size:17px;font-weight:600;line-height:1.1}
.rn small{font-size:11px;color:var(--mut);height:13px}
.rn .rb{position:absolute;top:2px;left:20%;right:20%;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.rn .rb i{display:block;height:100%;background:var(--blue)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:4px 2px 0}
.msg{position:absolute;inset:0;z-index:5;background:rgba(11,17,28,.88);display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;font-size:24px;text-align:center;padding:60px}
.msg.on{display:flex}
.msg p{font-size:16px;color:var(--mut);max-width:620px}
.msg button{border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:10px 22px;font-size:17px;font-weight:600}

/* ---------- map picker ---------- */
.mapov{position:absolute;inset:0;z-index:8;background:var(--bg);display:none;flex-direction:column;gap:10px;padding:16px}
.mapov.on{display:flex}
.mbar{display:flex;gap:10px;align-items:center;position:relative}
.mbar input{flex:1;height:48px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:var(--panel);color:var(--tx);font:inherit;font-size:18px;padding:0 16px;outline:none;user-select:text;-webkit-user-select:text}
.mbar input:focus{border-color:var(--blue)}
.mb{height:48px;padding:0 20px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);font-size:17px;font-weight:600;white-space:nowrap}
.mb.pri{background:var(--blue);border-color:var(--blue);color:#06121f}
.mb:disabled{opacity:.4}
.mapres{position:absolute;left:0;top:54px;width:640px;max-width:100%;z-index:1000;background:#1a2436;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mapres:empty{display:none}
.mapres button{display:block;width:100%;text-align:left;padding:12px 16px;font-size:17px;border-bottom:1px solid var(--line)}
.mapres button span{color:var(--mut);font-size:15px;margin-left:6px}
.mapres .none{padding:12px 16px;color:var(--mut)}
.mapbox{flex:1;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#1a2436;position:relative}
.mapfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px;text-align:center;padding:40px}
.mfoot{display:flex;gap:10px;align-items:center}
.mfoot .sel{flex:1;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfoot .sel small{color:var(--mut);font-size:14px;display:block}
.place .chev{opacity:.7;margin-left:2px}
.fs{border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;margin-left:12px;font-size:12px;color:var(--tx);display:none}
.fs.on{display:inline-block}

/* ---------- favorites ---------- */
.favs{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.favh{padding:6px 4px 0}
.favlist{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;border-radius:20px}
.favlist::-webkit-scrollbar{display:none}
.fav{position:relative;height:104px;flex:none;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#1a2436;text-align:left;cursor:pointer}
.fav.act{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.fmap{position:absolute;inset:0;filter:brightness(.6) saturate(.8)}
.fmap img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.fav::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,17,28,.82),rgba(11,17,28,.15));pointer-events:none}
.fin{position:absolute;inset:0;z-index:2;padding:11px 14px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.fname{font-size:17px;font-weight:700;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.fwx{display:flex;align-items:center;gap:6px}
.fwx b{font-size:34px;font-weight:600;letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.fwx svg{width:38px;height:38px}
.fstar{position:absolute;top:6px;right:6px;z-index:3;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.favempty{border:1.5px dashed rgba(255,255,255,.18);border-radius:20px;padding:20px 16px;color:var(--mut);font-size:15px;line-height:1.45;text-align:left}
.favcr{font-size:10px;color:#566478;text-align:center}
.hstar{position:absolute;top:12px;right:14px;z-index:3;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mstar{padding:0 14px;display:flex;align-items:center}

/* ---------- hero map + tile graphics ---------- */
.hero>.hmap,.hero>.hsky{position:absolute;inset:0;z-index:0}
.hmap{filter:saturate(1.05) contrast(1.03)}
.hmap img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.hsky{opacity:.38}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,22,44,.30),rgba(8,22,44,0) 34%,rgba(8,22,44,0) 52%,rgba(8,22,44,.42))}
.hero{text-shadow:0 1px 6px rgba(0,0,0,.45)}
.gfx{position:absolute;right:14px;top:30px;pointer-events:none;line-height:0}
.tsub{overflow:hidden;text-overflow:ellipsis}
.sm{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.sm div{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:600;white-space:nowrap}
.sm em{font-style:normal;color:var(--mut);font-size:14px;margin-right:-3px}
.sm svg{flex:none}

.hr{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.hr div{display:flex;align-items:center;gap:8px}
.hr b{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hr small{font-size:14px;color:var(--mut);margin-left:-3px}
.td{height:32px}
.dly .td{height:38px}
.td span{font-size:18px;font-weight:600;line-height:1.05}
.td small{font-size:11px;color:var(--mut);height:12px;white-space:nowrap}
.td .tdl{font-size:14px;line-height:1.2;white-space:nowrap}
.td .tdl i{font-style:normal;font-size:11px;margin-right:2px}
.td .tdl small{display:inline;font-size:12px;margin-left:4px;height:auto}
.hd{height:32px}.ic{height:36px}.ic svg{width:30px;height:30px}.tp{height:90px}.ar{height:22px}.wb{height:52px}.wn{height:32px}.wv{height:30px}.td2{height:76px}.rn{height:40px}
.hum{position:absolute;left:16px;top:34px;display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600;line-height:1}

.tt{font-size:12.5px;font-weight:600;white-space:nowrap}
.sub .upd{margin-left:auto;margin-top:0;font-size:13px;opacity:.85}
.hero{padding-bottom:12px}
.wcap{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8fa0b6;margin-top:1px;line-height:1.1}
.rn2{margin-top:auto;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rn2 b{display:block;font-size:30px;line-height:1;font-weight:600;letter-spacing:-.02em}
.rn2 span{display:block;font-size:12.5px;color:var(--mut);line-height:1.25}
.favs .fs{margin:0 auto;padding:7px 16px;font-size:13px}
.favs .fs.on{display:block}
.favcr{line-height:1.5}
.u{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut)}
.row.wv{height:24px}
.row.wv>div{flex-direction:row;align-items:baseline;justify-content:center;gap:5px}
.row.wv small{height:auto;font-size:12px}
.row.rn{height:26px}
.row.rn>div{justify-content:center}
.row.ic>div{flex-direction:row;gap:5px}
.rp{font-size:13.5px;font-weight:500}
.gfx.al{top:30px;right:14px;width:84px;display:flex;justify-content:center}
.row.wl{height:58px}
.tp{height:80px}
.td2{height:68px}
.row.wl{height:150px}
.ar{height:30px}
.wn{height:42px}
.wn span{font-size:27px}
.wn small{font-size:16px}
.wind-dir{position:absolute;transform:translate(-50%,-50%)}
.wg{position:absolute;transform:translate(-50%,-100%);font-size:19px;font-weight:600;color:#cfe6fa;white-space:nowrap;line-height:1}
.ws{position:absolute;transform:translate(-50%,0);font-size:19px;font-weight:600;white-space:nowrap;line-height:1}
.step{border:0;border-radius:0;padding:6px 0;color:var(--mut);letter-spacing:.12em;text-align:left}

/* ---------- main card redesign: frosted panels over the map ---------- */
.hero{padding:14px 16px 14px}
.hero>.hmap,.hero>.hsky{position:absolute}
.hsky{opacity:.30}
.glass{background:rgba(9,20,38,.5);-webkit-backdrop-filter:blur(8px) saturate(1.25);backdrop-filter:blur(8px) saturate(1.25);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:8px 12px}
.hhead{align-self:flex-start;max-width:calc(100% - 52px)}
.place{font-size:19px;line-height:1.15}
.place span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.when{font-size:14px;opacity:.9;margin-top:3px;text-align:left}
.hero .mid{margin:auto 0 8px}
.temp{font-size:90px;text-shadow:0 2px 16px rgba(0,0,0,.55)}
.hero .ico{width:90px;height:90px}
.hfoot{padding:8px 12px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .cond{font-size:22px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpr{font-size:15px;font-weight:600;white-space:nowrap}
.hpr small{font-size:12px;opacity:.75;font-weight:500}
.hero .sub{font-size:14px;gap:12px;opacity:1;margin-top:3px}
.hero .sub .upd{margin-left:auto;font-size:12px;opacity:.8}
/* ---------- visibility ---------- */
@keyframes fogblink{0%,100%{opacity:1}50%{opacity:.3}}
.fogtag{font-size:10px;font-weight:800;letter-spacing:.14em;color:#ff6b8a;animation:fogblink 1.3s ease-in-out infinite;line-height:1}
.tsub .fogtag{font-size:15px}
.row.vis{height:36px}
.row.vis>div{gap:0}
.vv{font-size:16px;font-weight:700;line-height:1.05}
.vb{display:block;height:4px;width:62%;border-radius:2px;margin-top:3px}
.row.vis .fogtag{margin-bottom:1px}
.tp{height:72px}
.row.wl{height:136px}
.td2{height:64px}
.row.vis{height:32px}
.vd{color:var(--mut);margin:0 2px;font-weight:500}
.cols i.n{background:rgba(255,206,110,.06)}
.tp{height:66px}
.td2{height:58px}
.ic{height:34px}
.row.vis{height:34px}
.row.wvl{height:78px}
.ws small{font-size:13.5px;font-weight:500;color:var(--mut);margin-left:3px}
.hd{height:30px}.ic{height:32px}.row.vis{height:32px}.tp{height:66px}.row.wl{height:126px}.row.wvl{height:70px}.row.tcur{height:82px}
.trow{display:flex;align-items:baseline}.trow .tv{min-width:46px;text-align:right}.trow .tt{margin:0 0 0 auto;font-style:normal;color:inherit;font-size:17px;font-weight:600;text-align:right}
.lu{text-transform:none;letter-spacing:0;font-weight:600;opacity:.85}
.row>b.dual{position:relative;align-self:stretch}
.row>b.dual>span{position:absolute;left:0;transform:translateY(-50%);white-space:nowrap}
.cur{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;white-space:nowrap}
.cur span{font-size:17px;font-weight:700;color:#bfe3ff}
.tp{height:62px}.row.wl{height:122px}.row.wvl{height:62px}.row.tcur{height:98px}
.tl2{position:absolute;white-space:nowrap;font-size:11.5px;font-weight:700}
.dtl{position:absolute;white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:-.1px;transform:translateX(-50%)}
.cm{position:absolute;display:flex;align-items:center;gap:3px;white-space:nowrap;transform:translate(-10px,-50%)}
.cm.rev{flex-direction:row-reverse;transform:translate(calc(-100% + 10px),-50%)}
.cm span{font-size:13px;font-weight:700;background:rgba(15,25,40,.6);padding:0 2px;border-radius:4px}
.sl{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;color:#9fb3c8;background:rgba(19,27,41,.88);padding:0 3px;border-radius:4px;white-space:nowrap}
.wvt{position:absolute;transform:translate(-50%,-50%);font-size:12px;color:#ffb347}
.dot.now{border-color:#fff;background:#5cb8ff}
.dual small{display:block;font-size:10.5px;color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500;line-height:1.25}
.tnow{position:absolute;left:14px;top:28px;font-size:12.5px;line-height:1.25;pointer-events:none}
.tnow b{display:block;font-weight:700;color:#bfe3ff}
.tnow div{display:flex;align-items:center;gap:3px;color:#cfe6fa;font-weight:600}
.cp{position:absolute;transform:translate(-50%,-50%);display:flex;gap:10px;white-space:nowrap}
.cp div{display:flex;align-items:center;gap:3px}
.cp span{font-size:13px;font-weight:700;background:rgba(15,25,40,.6);padding:0 2px;border-radius:4px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.tcb{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tcb span{font-size:12.5px;font-weight:700;color:#bfe3ff}
.tnl{position:absolute;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.cnl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;white-space:nowrap}
.cnl span{background:rgba(15,25,40,.6);padding:0 2px;border-radius:4px}

.favh{display:flex;justify-content:space-between;align-items:center}
.helpbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--line);color:#c9d6e6;border-radius:14px;padding:2px 9px 2px 6px;font:600 12px system-ui;cursor:pointer;text-transform:none;letter-spacing:0}
.ttl{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
#help{display:none;position:fixed;inset:0;z-index:9999;background:rgba(5,10,18,.72)}
#help.on{display:block}
.hl{position:fixed;border:2.5px solid #ffc43d;border-radius:12px;box-shadow:0 0 0 3px rgba(255,196,61,.25),0 0 14px rgba(255,196,61,.6);pointer-events:none}

<script>
(()=>{
const $=s=>document.getElementById(s);
const KN={'kts':1,'km/h':1.852,'mph':1.15078,'m/s':0.514444};
const WU=Object.keys(KN);
const P={t:'C',w:'kts',step:1,wv:'m',vu:'km'};
try{Object.assign(P,JSON.parse(localStorage.getItem('wx-prefs')||'{}'))}catch(e){}
if(!KN[P.w])P.w='kts';
if(P.wv!=='ft')P.wv='m';
if(P.vu!=='nm')P.vu='km';
if(![0,1,3,6].includes(P.step))P.step=1;
const savePrefs=()=>{try{localStorage.setItem('wx-prefs',JSON.stringify(P))}catch(e){}};
const qs=new URLSearchParams(location.search);
let D=null,LOC=null;
const N=12;

/* ---------- fit 4:3 stage ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/768);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`;document.documentElement.style.setProperty('--sc',s)}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
const T=c=>Math.round(P.t==='F'?c*9/5+32:c);
const W=k=>{const v=k*KN[P.w];return v<10&&P.w!=='kts'&&P.w!=='km/h'?Math.round(v*10)/10:Math.round(v)};
const H12DEV=(()=>{try{return new Intl.DateTimeFormat([],{hour:'numeric'}).resolvedOptions().hour12}catch(e){return false}})();
const is12=()=>P.clk==='12'?true:P.clk==='24'?false:H12DEV;
const clk=(d,tz)=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hourCycle:is12()?'h12':'h23',...(tz?{timeZone:tz}:{})});
const p2=n=>String(n).padStart(2,'0');
const hLab=h=>is12()?((h%12||12)+(h<12?'a':'p')):p2(h);
const tLab=s=>{const h=+s.slice(11,13),m=s.slice(14,16);return is12()?`${h%12||12}:${m} ${h<12?'AM':'PM'}`:`${p2(h)}:${m}`};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dow=s=>DAYS[new Date(s.slice(0,10)+'T12:00:00Z').getUTCDay()];
const CARD=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const card=d=>CARD[Math.round(d/22.5)%16];

const WX={0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
const kind=c=>c===0?'clear':c<=2?'pcloud':c===3?'cloud':c<=48?'fog':c<=67||(c>=80&&c<=82)?'rain':c<=77||c===85||c===86?'snow':'storm';

/* ---------- icons ---------- */
function icon(c,day){
  const k=kind(c);
  const sun=(x,y,r,ray)=>{let g=`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffc93c"/>`;
    for(let i=0;i<8;i++){const a=i*Math.PI/4,r1=r+4,r2=r+ray;g+=`<line x1="${x+Math.cos(a)*r1}" y1="${y+Math.sin(a)*r1}" x2="${x+Math.cos(a)*r2}" y2="${y+Math.sin(a)*r2}" stroke="#ffc93c" stroke-width="3.5" stroke-linecap="round"/>`}return g};
  const moon=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M26 2A24 24 0 1 0 46 38 19 19 0 0 1 26 2z" fill="#dfe6ff"/>`;
  const cloud=(f,tx=0,ty=0,s=1)=>`<g fill="${f}" transform="translate(${tx} ${ty}) scale(${s})"><circle cx="22" cy="38" r="10"/><circle cx="35" cy="30" r="14"/><circle cx="48" cy="39" r="9"/><rect x="22" y="38" width="26" height="10"/></g>`;
  const cf=day?'#eef3f9':'#b9c4d6', cd=day?'#b4c2d3':'#8794ab';
  let b='';
  if(k==='clear')b=day?sun(32,32,12,8):moon(8,8,.95);
  else if(k==='pcloud')b=(day?sun(24,24,9,6):moon(2,0,.6))+cloud(cf,4,6,.9);
  else if(k==='cloud')b=cloud(cd,-2,0,1.05)+cloud(cf,6,6,.95);
  else if(k==='fog')b=cloud(cf,0,-4,1)+'<g stroke="#c9d4e2" stroke-width="3.5" stroke-linecap="round"><line x1="14" y1="52" x2="50" y2="52"/><line x1="20" y1="59" x2="56" y2="59"/></g>';
  else if(k==='rain')b=cloud(cd,0,-6,1)+'<g stroke="#5cb8ff" stroke-width="3.5" stroke-linecap="round"><line x1="26" y1="48" x2="22" y2="58"/><line x1="36" y1="48" x2="32" y2="58"/><line x1="46" y1="48" x2="42" y2="58"/></g>';
  else if(k==='snow')b=cloud(cf,0,-6,1)+'<g fill="#fff"><circle cx="24" cy="52" r="3"/><circle cx="35" cy="57" r="3"/><circle cx="46" cy="52" r="3"/></g>';
  else b=cloud('#8794ab',0,-8,1)+'<polygon points="37,40 27,54 34,54 31,64 45,48 37,48 41,40" fill="#ffd23c"/>';
  return `<svg viewBox="0 0 64 64">${b}</svg>`;
}
function sky(c,day){const k=kind(c);
  if(!day)return k==='clear'||k==='pcloud'?'linear-gradient(160deg,#0b1330,#2a3a78)':'linear-gradient(160deg,#10172b,#38455e)';
  return {clear:'linear-gradient(160deg,#2b7fd8,#7ec8ff)',pcloud:'linear-gradient(160deg,#3a82c9,#97c4e6)',cloud:'linear-gradient(160deg,#55667b,#93a3b6)',
  fog:'linear-gradient(160deg,#6b7786,#aeb8c3)',rain:'linear-gradient(160deg,#2f4057,#5d7189)',snow:'linear-gradient(160deg,#6d86a3,#c3d3e4)',storm:'linear-gradient(160deg,#252b44,#4d5578)'}[k]}

/* ---------- location ---------- */
const getJSON=async(u,t=9000)=>{const c=new AbortController();const id=setTimeout(()=>c.abort(),t);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(id)}};
async function revName(lat,lon){
  try{const j=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language=en&lat=${lat}&lon=${lon}`);
    const a=j.address||{};const place=a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.city||a.municipality||a.county;
    const muni=(a.municipality||'').replace(/s?\s*Regionskommune$/i,'').replace(/\s+(Kommune|kommun)$/i,'');
    const reg=a.island||(a.country_code==='dk'&&muni?muni:(a.state||a.region||(a.country_code==='us'?'':a.country)));
    if(place)return [place,reg].filter(Boolean).join(', ')}catch(e){}
  try{const j=await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    return [j.locality||j.city,j.principalSubdivision].filter(Boolean).join(', ')}catch(e){}
  return ''}
const geo=()=>new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('nogeo'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),rej,{enableHighAccuracy:true,timeout:15000,maximumAge:60000})});
const saved=()=>{try{return JSON.parse(localStorage.getItem('wx-loc')||'null')}catch(e){return null}};
let PICK=null;try{PICK=JSON.parse(localStorage.getItem('wx-pick')||'null')}catch(e){}
const DEFAULT_LOC={lat:47.7573,lon:-122.2443,name:'Kenmore, WA',src:'default'};
async function locate(){
  if(qs.has('lat')&&qs.has('lon'))return {lat:+qs.get('lat'),lon:+qs.get('lon'),name:qs.get('name')||'',src:'manual'};
  if(PICK)return {...PICK,src:'picked'};                         // chosen on the map
  let l=null;
  try{l=await geo();l.src='gps'}catch(e){}                       // device GPS
  if(!l)return {...DEFAULT_LOC};                                 // GPS unavailable -> Kenmore, WA
  const old=saved();
  const moved=!old||Math.abs(old.lat-l.lat)>0.02||Math.abs(old.lon-l.lon)>0.02;
  if(old&&!moved)l.name=old.name;
  if(!l.name)l.name=await revName(l.lat,l.lon);
  if(!l.name)l.name=`${l.lat.toFixed(2)}°, ${l.lon.toFixed(2)}°`;
  try{localStorage.setItem('wx-loc',JSON.stringify({lat:l.lat,lon:l.lon,name:l.name}))}catch(e){}
  return l;
}

/* ---------- data ---------- */
async function fetchWx(l){
  if(qs.has('demo'))return demo();
  const u='https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lon+
  '&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,is_day,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility'+
  '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,visibility'+
  '&daily=weather_code,sunrise,sunset,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant'+
  '&wind_speed_unit=kn&timezone=auto&past_days=1&forecast_days=8';
  const mu='https://marine-api.open-meteo.com/v1/marine?latitude='+l.lat+'&longitude='+l.lon+
  '&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature,sea_level_height_msl,ocean_current_velocity,ocean_current_direction&daily=wave_height_max,wave_period_max,wave_direction_dominant&timezone=auto&past_days=1&forecast_days=8';
  const [w,m]=await Promise.all([getJSON(u,15000),getJSON(mu,15000).catch(()=>null)]);
  w.marine=m&&m.hourly?m.hourly:null;w.marineDaily=m&&m.daily?m.daily:null;w.marineUnits=m&&m.hourly_units?m.hourly_units:null;   // null = no marine data for this spot (e.g. inland)
  return w;
}
function demo(){ // synthetic data for layout checks (?demo)
  const now=new Date(),y=now.getFullYear(),mo=p2(now.getMonth()+1),d=now.getDate();
  const hourly={time:[],temperature_2m:[],precipitation_probability:[],precipitation:[],weather_code:[],pressure_msl:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],is_day:[],visibility:[]};
  for(let i=0;i<120;i++){const dt=new Date(Date.UTC(y,now.getMonth(),d-1,i)),h=dt.getUTCHours();
    hourly.time.push(dt.toISOString().slice(0,13)+':00');hourly.temperature_2m.push(14+6*Math.sin((h-9)/24*6.283)+i*.03);
    hourly.precipitation_probability.push(Math.max(0,Math.round(50*Math.sin(i/9))));hourly.precipitation.push(Math.max(0,Math.sin(i/9)*.8));
    hourly.weather_code.push([0,1,2,3,61,0,2][Math.floor(i/7)%7]);hourly.pressure_msl.push(1014-i*.08);
    const ws=9+7*Math.sin(i/8);hourly.wind_speed_10m.push(ws);hourly.wind_gusts_10m.push(ws*1.35);hourly.wind_direction_10m.push(250+i*3);hourly.is_day.push(h>=7&&h<18?1:0);hourly.visibility.push(h>=4&&h<=8?(h===6?250:900):(i%30<8?3500:24000))}
  const cur=new Date().toISOString().slice(0,13);
  return {timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    current:{time:cur+':00',temperature_2m:17.6,apparent_temperature:16.2,relative_humidity_2m:62,dew_point_2m:10.1,is_day:1,precipitation:0,weather_code:2,pressure_msl:1013.6,wind_speed_10m:12.4,wind_direction_10m:240,wind_gusts_10m:18.7,visibility:1800},
    marineDaily:{time:[0,1,2,3,4,5,6,7,8].map(k=>new Date(Date.UTC(y,now.getMonth(),d-1+k)).toISOString().slice(0,10)),wave_height_max:[.8,1.1,1.6,2.6,3.0,1.8,1.0,.9,1.2],wave_period_max:[5,5,6,8,9,7,5,5,6],wave_direction_dominant:[250,240,225,215,220,235,250,255,245]},
    marineUnits:{ocean_current_velocity:'km/h'},
    marine:{time:hourly.time,ocean_current_velocity:hourly.time.map((_,i)=>.3+2.4*Math.abs(Math.sin(2*Math.PI*i/12.42))),ocean_current_direction:hourly.time.map((_,i)=>Math.sin(2*Math.PI*i/12.42)>0?40:220),wave_height:hourly.time.map((_,i)=>1.1+.7*Math.sin(i/10)),wave_period:hourly.time.map((_,i)=>5+Math.sin(i/12)*1.5),sea_level_height_msl:hourly.time.map((_,i)=>1.4*Math.sin(2*Math.PI*i/12.42)+.2*Math.sin(i/170)),wave_direction:hourly.time.map((_,i)=>235+i),sea_surface_temperature:hourly.time.map(()=>17.2)},
    hourly,daily:(()=>{const o={time:[],weather_code:[],sunrise:[],sunset:[],temperature_2m_max:[],temperature_2m_min:[],uv_index_max:[],precipitation_sum:[],precipitation_probability_max:[],wind_speed_10m_max:[],wind_gusts_10m_max:[],wind_direction_10m_dominant:[]};
      for(let k=0;k<9;k++){const ds=new Date(Date.UTC(y,now.getMonth(),d-1+k)).toISOString().slice(0,10);o.time.push(ds);o.weather_code.push([2,0,3,61,63,1,0,2,3][k]);o.sunrise.push(ds+'T07:12');o.sunset.push(ds+'T17:48');
        o.temperature_2m_max.push(19+Math.sin(k)*3);o.temperature_2m_min.push(11+Math.sin(k)*2);o.uv_index_max.push(3.5);o.precipitation_sum.push([0,0,.4,6.2,9.1,.8,0,0,.3][k]);o.precipitation_probability_max.push([5,10,35,80,90,40,5,10,30][k]);
        o.wind_speed_10m_max.push(10+k*2%12);o.wind_gusts_10m_max.push(16+k*2%14);o.wind_direction_10m_dominant.push(200+k*20)}return o})()};
}


/* ---------- render ---------- */
const pin='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
/* moon: phase + rise/set (low-precision astronomical formulas) */
const RAD=Math.PI/180,OBL=RAD*23.4397;
const jd=ms=>ms/86400000-0.5+2440588-2451545;
const raOf=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const decOf=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
function moonC(d){const L=RAD*(218.316+13.176396*d),M=RAD*(134.963+13.064993*d),F=RAD*(93.272+13.22935*d),l=L+RAD*6.289*Math.sin(M),b=RAD*5.128*Math.sin(F);return{ra:raOf(l,b),dec:decOf(l,b),dist:385001-20905*Math.cos(M)}}
function sunC(d){const M=RAD*(357.5291+0.98560028*d),C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)),l=M+C+RAD*102.9372+Math.PI;return{ra:raOf(l,0),dec:decOf(l,0)}}
function moonAlt(ms,lat,lon){
  const d=jd(ms),c=moonC(d),H=RAD*(280.16+360.9856235*d)+RAD*lon-c.ra,phi=RAD*lat;
  let h=Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H));
  const hh=h<0?0:h;return h+0.0002967/Math.tan(hh+0.00312536/(hh+0.08901179));
}
function moonTimes(t0,lat,lon){        // t0 = local midnight (ms); returns hours after t0, or null
  const hc=0.133*RAD,at=i=>moonAlt(t0+i*3600000,lat,lon)-hc;
  let h0=at(0),rise=null,set=null;
  for(let i=1;i<=24;i+=2){
    const h1=at(i),h2=at(i+1),a=(h0+h2)/2-h1,b=(h2-h0)/2,xe=-b/(2*a),ye=(a*xe+b)*xe+h1,dd=b*b-4*a*h1;let roots=0,x1=0,x2=0;
    if(dd>=0){const dx=Math.sqrt(dd)/(Math.abs(a)*2);x1=xe-dx;x2=xe+dx;if(Math.abs(x1)<=1)roots++;if(Math.abs(x2)<=1)roots++;if(x1<-1)x1=x2}
    if(roots===1){if(h0<0)rise=i+x1;else set=i+x1}else if(roots===2){rise=i+(ye<0?x2:x1);set=i+(ye<0?x1:x2)}
    if(rise!=null&&set!=null)break;h0=h2;
  }
  return{rise,set};
}
function moonIllum(ms){
  const d=jd(ms),s=sunC(d),m=moonC(d),sd=149598000;
  const phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(sd*Math.sin(phi),m.dist-sd*Math.cos(phi));
  const ang=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  return{frac:(1+Math.cos(inc))/2,phase:0.5+0.5*inc*(ang<0?-1:1)/Math.PI};
}
const phaseName=p=>p<.03||p>.97?'New moon':p<.22?'Waxing crescent':p<.28?'First quarter':p<.47?'Waxing gibbous':p<.53?'Full moon':p<.72?'Waning gibbous':p<.78?'Last quarter':'Waning crescent';
function moonSvg(p,south,sz){
  const r=20,cx=24,cy=24,waning=p>0.5,pp=waning?1-p:p,k=Math.cos(2*Math.PI*pp);

/* ---------- tides: NOAA CO-OPS predictions (US) with Open-Meteo sea-level model as fallback ---------- */
let TD=null,TDK='',TDL=false;
const lm=t=>Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10),+t.slice(11,13),+t.slice(14,16));
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};
function tideH(ms){                     // height (m) at a local-time ms value: cosine interpolation between high/low
  if(!TD)return null;const e=TD.ext;
  if(e.length<2||ms<e[0].ms||ms>e[e.length-1].ms)return null;
  let i=0;while(i<e.length-2&&e[i+1].ms<=ms)i++;
  const a=e[i],b=e[i+1],f=(ms-a.ms)/(b.ms-a.ms);return a.v+(b.v-a.v)*(1-Math.cos(Math.PI*f))/2;
}
async function noaaTide(loc,w){
  const key=fkey(loc.lat,loc.lon);let cache={};try{cache=JSON.parse(localStorage.getItem('wx-stn')||'{}')}catch(e){}
  let st=cache[key];
  if(!st){
    const j=await getJSON('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions',25000);
    let best=null;for(const x of j.stations||[]){const d=hav(loc.lat,loc.lon,x.lat,x.lng);if(!best||d<best.d)best={d,id:x.id,name:x.name}}
    st=best&&best.d<=60?{id:best.id,name:best.name,d:Math.round(best.d)}:{none:1};
    cache[key]=st;try{localStorage.setItem('wx-stn',JSON.stringify(cache))}catch(e){}
  }
  if(st.none)return null;
  const ds=w.current.time.slice(0,10),d0=Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10));
  const f=o=>new Date(d0+o*86400000).toISOString().slice(0,10).replace(/-/g,'');
  const j=await getJSON('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=weather_tablet&datum=MLLW&station='+st.id+'&time_zone=lst_ldt&units=metric&interval=hilo&format=json&begin_date='+f(-1)+'&end_date='+f(8),15000);
  if(!j.predictions||j.predictions.length<2)return null;
  return{src:'NOAA',name:st.name,d:st.d,ext:j.predictions.map(p=>{const t=p.t.replace(' ','T');return{t,ms:lm(t),v:+p.v,type:p.type}})};
}
function modelTide(){                    // highs/lows found in the Open-Meteo sea-level series
  const m=D.marine&&D.marine.sea_level_height_msl;if(!m||m.every(x=>x==null))return null;
  const tt=D.marine.time,ext=[];
  for(let i=1;i<tt.length-1;i++){const a=m[i-1],b=m[i],c=m[i+1];if(a==null||b==null||c==null)continue;
    const hi=b>a&&b>=c,lo=b<a&&b<=c;if(!hi&&!lo)continue;
    const den=a-2*b+c,off=den?0.5*(a-c)/den:0,ms=lm(tt[i])+off*3600000;
    ext.push({t:new Date(ms).toISOString().slice(0,16),ms,v:b-0.25*(a-c)*off,type:hi?'H':'L'})}
  return ext.length>=2?{src:'model',name:'model estimate',d:0,ext}:null;
}
async function loadTide(){
  const tk=TDK;TDL=true;let td=null;
  if(!qs.has('demo')){try{td=await noaaTide(LOC,D)}catch(e){}}
  if(!td&&D)td=modelTide();
  if(tk!==TDK)return;
  TD=td;TDL=false;render();
}

/* ---------- currents: NOAA tidal-current predictions (US) with Open-Meteo model as fallback ---------- */
let CUR=null,CURK='';
async function noaaCurrent(loc,w){
  const key=fkey(loc.lat,loc.lon);let cache={};try{cache=JSON.parse(localStorage.getItem('wx-cstn')||'{}')}catch(e){}
  let st=cache[key];
  if(!st){
    const j=await getJSON('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=currentpredictions&units=english',25000);
    let best=null;for(const x of j.stations||[]){const d=hav(loc.lat,loc.lon,x.lat,x.lng);if(!best||d<best.d)best={d,id:x.id,name:x.name,bin:x.currbin}}
    st=best&&best.d<=20?{id:best.id,name:best.name,bin:best.bin,d:Math.round(best.d)}:{none:1};
    cache[key]=st;try{localStorage.setItem('wx-cstn',JSON.stringify(cache))}catch(e){}
  }
  if(st.none)return null;
  const ds=w.current.time.slice(0,10),d0=Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10));
  const f=o=>new Date(d0+o*86400000).toISOString().slice(0,10).replace(/-/g,'');
  const j=await getJSON('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=currents_predictions&interval=MAX_SLACK&station='+st.id+(st.bin!=null?'&bin='+st.bin:'')+'&units=english&time_zone=lst_ldt&format=json&begin_date='+f(-1)+'&end_date='+f(8),15000);
  const cp=j.current_predictions&&(j.current_predictions.cp||j.current_predictions);
  if(!Array.isArray(cp)||cp.length<3)return null;
  let fdir=null,edir=null;
  const ev=cp.map(p=>{const t=String(p.Time||p.t).replace(' ','T'),type=String(p.Type||p.type||'').toLowerCase(),vel=Math.abs(+(p.Velocity_Major??p.v)||0);
    if(type==='flood'&&p.meanFloodDir!=null)fdir=+p.meanFloodDir;if(type==='ebb'&&p.meanEbbDir!=null)edir=+p.meanEbbDir;
    return{t,ms:lm(t),v:type==='ebb'?-vel:type==='flood'?vel:0}});
  return{src:'NOAA',name:st.name,d:st.d,ev,fdir,edir};
}
function modelCurrent(){
  const m=D&&D.marine;if(!m||!m.ocean_current_velocity||m.ocean_current_velocity.every(x=>x==null))return null;
  const u=String((D.marineUnits&&D.marineUnits.ocean_current_velocity)||'km/h');
  return{src:'model',fac:/m\/s|ms/i.test(u)?1.94384:/kn|kt/i.test(u)?1:/mp/i.test(u)?0.868976:0.539957};
}
async function loadCurrent(){
  const ck=CURK;let c=null;
  if(!qs.has('demo')){try{c=await noaaCurrent(LOC,D)}catch(e){}}
  if(qs.has('demo')&&qs.has('noaa')&&D){const ev=[];let t=lm(D.hourly.time[0]);const ty=[0,1,0,-1];for(let q=0;q<90;q++){ev.push({t:new Date(t).toISOString().slice(0,16),ms:t,v:ty[q%4]*(1.2+.5*Math.sin(q/3))});t+=3.1*3600000}c={src:'NOAA',name:'demo',d:0,ev,fdir:20,edir:200}}
  if(!c&&D)c=modelCurrent();
  if(ck!==CURK)return;
  CUR=c;render();
}

/* ---------- favorites ---------- */
let FAVS=[];try{FAVS=JSON.parse(localStorage.getItem('wx-favs')||'[]')||[]}catch(e){}
const FW={};
const saveFavs=()=>{try{localStorage.setItem('wx-favs',JSON.stringify(FAVS))}catch(e){}};
const near=(a,b)=>Math.abs(a.lat-b.lat)<0.02&&Math.abs(a.lon-b.lon)<0.02;
const favIdx=l=>l?FAVS.findIndex(f=>near(f,l)):-1;
const fkey=(a,b)=>a.toFixed(3)+','+b.toFixed(3);
const starSvg=(on,sz)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${on?'#ffc93c':'none'}" stroke="${on?'#ffc93c':'#fff'}" stroke-width="2" stroke-linejoin="round"><polygon points="12,2.5 14.9,8.8 21.8,9.6 16.7,14.3 18.1,21.1 12,17.7 5.9,21.1 7.3,14.3 2.2,9.6 9.1,8.8"/></svg>`;
function tileBg(lat,lon,w,h,z){           // a piece of the OpenStreetMap, centred on the location
  const n=256*Math.pow(2,z),m=Math.pow(2,z);
  const px=(lon+180)/360*n,sn=Math.sin(lat*Math.PI/180),py=(0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*n;
  const tx=Math.floor(px/256),ty=Math.floor(py/256);let o='';
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=((tx+dx)%m+m)%m,y=ty+dy;if(y<0||y>=m)continue;
    o+=`<img alt="" draggable="false" onerror="this.style.display='none'" src="https://tile.openstreetmap.org/${z}/${x}/${y}.png" style="left:${((tx+dx)*256-px+w/2).toFixed(1)}px;top:${((ty+dy)*256-py+h/2).toFixed(1)}px">`}
  return o;
}
function renderFavs(){
  const el=$('favlist');
  if(!FAVS.length){el.innerHTML='<div class="favempty">No favorites yet.<br>Tap the ☆ by the place name, or in the map picker, to save a location here.</div>';return}
  el.innerHTML=FAVS.map((f,i)=>{const w=FW[fkey(f.lat,f.lon)],act=LOC&&near(f,LOC);
    return `<div class="fav${act?' act':''}" data-i="${i}"><div class="fmap">${tileBg(f.lat,f.lon,244,104,10)}</div>
      <div class="fin"><div class="fname">${esc(f.name)}</div><div class="fwx">${w?`<b>${T(w.t)}°</b>${icon(w.code,w.day)}`:''}</div></div>
      <button class="fstar" data-star="${i}" aria-label="Remove favorite">${starSvg(true,24)}</button></div>`}).join('');
}
function updateStars(){
  $('hstar').innerHTML=starSvg(favIdx(LOC)>=0,28);
  $('mapstar').innerHTML=starSvg(PEND&&favIdx(PEND)>=0,24);
}
function toggleFav(l,name){
  if(!l)return;const i=favIdx(l);
  if(i>=0)FAVS.splice(i,1);
  else FAVS.push({lat:+l.lat.toFixed(4),lon:+l.lon.toFixed(4),name:name||l.name||`${l.lat.toFixed(2)}°, ${l.lon.toFixed(2)}°`});
  saveFavs();renderFavs();updateStars();loadFavWx();
}
async function loadFavWx(){
  if(!FAVS.length)return;
  if(qs.has('demo')){FAVS.forEach((f,k)=>FW[fkey(f.lat,f.lon)]={t:8+k*3,code:[0,2,61,3][k%4],day:1});renderFavs();return}
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+FAVS.map(f=>f.lat).join(',')+'&longitude='+FAVS.map(f=>f.lon).join(',')+'&current=temperature_2m,weather_code,is_day&timezone=auto';
    let j=await getJSON(u,15000);if(!Array.isArray(j))j=[j];
    j.forEach((r,k)=>{if(r&&r.current&&FAVS[k])FW[fkey(FAVS[k].lat,FAVS[k].lon)]={t:r.current.temperature_2m,code:r.current.weather_code,day:r.current.is_day}});
    renderFavs();
  }catch(e){}
}
$('favlist').onclick=e=>{
  const st=e.target.closest('[data-star]');
  if(st){FAVS.splice(+st.dataset.star,1);saveFavs();renderFavs();updateStars();return}
  const c=e.target.closest('.fav');if(!c)return;const f=FAVS[+c.dataset.i];if(!f)return;
  PICK={lat:f.lat,lon:f.lon,name:f.name};try{localStorage.setItem('wx-pick',JSON.stringify(PICK))}catch(err){}
  D=null;load();
};
$('hstar').onclick=()=>toggleFav(LOC);
$('rows').addEventListener('click',e=>{if(e.target.closest('.step')||!e.target.closest('.row.hd'))return;P.clk=is12()?'24':'12';savePrefs();render()});
$('mapstar').onclick=()=>{if(PEND)toggleFav(PEND,PEND.name)};

/* ---------- map picker ---------- */
let MAP=null,MK=null,PEND=null,leafletP=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
    const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    sc.onload=res;sc.onerror=()=>{leafletP=null;rej(new Error('map'))};document.head.appendChild(sc)});
  return leafletP;
}
function selLabel(){
  if(!PEND)return;
  $('mapsel').innerHTML=`${esc(PEND.name||'Selected point')}<small>${PEND.lat.toFixed(3)}°, ${PEND.lon.toFixed(3)}° — tap the map to move the pin</small>`;
}
function setPend(lat,lon,name,pan){
  const me=PEND={lat,lon,name:name||''};
  selLabel();$('mapset').disabled=false;updateStars();
  if(MAP){
    if(!MK)MK=L.circleMarker([lat,lon],{radius:11,color:'#fff',weight:3,fillColor:'#5cb8ff',fillOpacity:1}).addTo(MAP);else MK.setLatLng([lat,lon]);
    if(pan)MAP.setView([lat,lon],Math.max(MAP.getZoom(),9));
  }
  if(!name){revName(lat,lon).then(n=>{if(PEND===me&&n){me.name=n;selLabel()}})}
}
async function openMap(){
  $('mapov').classList.add('on');$('mapq').value='';$('mapres').innerHTML='';
  setPend(LOC.lat,LOC.lon,LOC.name,false);
  try{
    await loadLeaflet();
    if(!MAP){
      $('mapbox').innerHTML='';
      MAP=L.map('mapbox').setView([LOC.lat,LOC.lon],9);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(MAP);
      MAP.on('click',e=>setPend(e.latlng.lat,e.latlng.lng,'',false));
    }
    setTimeout(()=>{MAP.invalidateSize();setPend(LOC.lat,LOC.lon,LOC.name,true)},60);
  }catch(e){
    $('mapbox').innerHTML='<div class="mapfail">The map could not be loaded (needs internet).<br>You can still search for a place above.</div>';
  }
}
function closeMap(){$('mapov').classList.remove('on');$('mapres').innerHTML=''}
async function mapSearch(){
  const q=$('mapq').value.trim();if(!q)return;
  try{
    const j=await getJSON('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=en&format=json');
    const r=j.results||[];
    $('mapres').innerHTML=r.length?r.map((x,i)=>`<button data-i="${i}"><b>${esc(x.name)}</b><span>${esc([x.admin1,x.country].filter(Boolean).join(', '))}</span></button>`).join(''):'<div class="none">No matches</div>';
    $('mapres').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=r[+b.dataset.i];
      $('mapres').innerHTML='';setPend(x.latitude,x.longitude,[x.name,x.admin1].filter(Boolean).join(', '),true)};
  }catch(e){$('mapres').innerHTML='<div class="none">Search failed — check the connection</div>'}
}
$('mapgo').onclick=mapSearch;
$('mapq').addEventListener('keydown',e=>{if(e.key==='Enter')mapSearch()});
$('mapcancel').onclick=closeMap;
$('mapset').onclick=()=>{
  if(!PEND)return;
  PICK={lat:PEND.lat,lon:PEND.lon,name:PEND.name||`${PEND.lat.toFixed(2)}°, ${PEND.lon.toFixed(2)}°`};
  try{localStorage.setItem('wx-pick',JSON.stringify(PICK))}catch(e){}
  closeMap();D=null;load();           // refresh all weather + marine data for the new place
};
$('mapgps').onclick=()=>{PICK=null;try{localStorage.removeItem('wx-pick')}catch(e){}closeMap();D=null;load()};

/* ---------- main ---------- */
function show(html){$('msg').innerHTML=html;$('msg').classList.add('on')}
async function load(force){
  if(!D)show('Locating…');
  try{
    LOC=await locate();
    D=await fetchWx(LOC);
    $('msg').classList.remove('on');
    UPDT=new Date();
    const tkey=fkey(LOC.lat,LOC.lon);if(tkey!==TDK){TD=null;TDK=tkey}
    if(tkey!==CURK){CUR=null;CURK=tkey}
    render();loadFavWx();loadTide();loadCurrent();
  }catch(e){
    if(D){$('upd').textContent='Update failed — showing last data';return}
    show(`Weather unavailable<p>${e&&e.message&&e.message.length<80?e.message:'Check the network connection.'} If location is blocked, open this page with <b>?lat=55.68&amp;lon=12.57&amp;name=Copenhagen</b> added to the address.</p><button id="retry">Try again</button>`);
    $('retry').onclick=()=>load(true);
  }
}
/* ---------- app mode: full screen, keep awake, offline shell ---------- */
const standalone=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const fsEl=document.documentElement;
if(!standalone&&(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen)){
  $('fs').classList.add('on');
  const upd=()=>$('fs').classList.toggle('on',!(document.fullscreenElement||document.webkitFullscreenElement));
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
  $('fs').onclick=()=>{try{(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl)}catch(e){}};
}
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);keepAwake();
addEventListener('pointerdown',keepAwake,{once:true});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
load(false);
setInterval(()=>load(false),10*60*1000);
setInterval(clock,20000);
})();

/* ---- Help: highlight clickable features ---- */
(function(){
  const H=document.getElementById('help');
  const items=[['#place','Place name – choose a location on the map'],['#hstar','Star – add / remove Favorite'],['#temp','Temperature – °C / °F'],['#twind','Wind – kts / km/h / mph / m/s'],['#tvis','Visibility – km / nm'],['#twave','Waves – m / ft'],['#ttile','Tides – tap title for m / ft'],['#stepb','View – Hourly / 3-Hours / 6-Hours / Daily'],['@hrs','Time header – 12h / 24h clock'],['.fav','Favorites – tap to switch, ★ removes'],['#fs','Full screen']];
  function open(){
    let h='',l='',n=0;
    items.forEach(([q,t])=>{let r;if(q==='@hrs'){const cs=[...document.querySelectorAll('#rows .row.hd>*:not(b)')];if(!cs.length)return;const rs=cs.map(c=>c.getBoundingClientRect());r={left:Math.min(...rs.map(x=>x.left)),top:Math.min(...rs.map(x=>x.top)),width:Math.max(...rs.map(x=>x.right))-Math.min(...rs.map(x=>x.left)),height:Math.max(...rs.map(x=>x.height))}}else{const e=document.querySelector(q);if(!e)return;r=e.getBoundingClientRect()}if(!r.width||!r.height)return;n++;
      h+=`<div class="hl" style="left:${r.left-3}px;top:${r.top-3}px;width:${r.width+6}px;height:${r.height+6}px"><i>${n}</i></div>`;
      l+=`<div><b>${n}</b>${t}</div>`});
    H.innerHTML=h+`<div class="hlg">${l}<button id="hok">Got it</button></div>`;
    H.classList.add('on');
  }
  function close(){H.classList.remove('on');H.innerHTML=''}
  document.getElementById('helpbtn').onclick=e=>{e.stopPropagation();open()};
  H.addEventListener('click',close);
  addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  addEventListener('resize',()=>{if(H.classList.contains('on'))open()});
})();
</script>
